[project]
name = "summer-school-gaussian-policy"
version = "0.1.0"
description = "Tutorial notebooks from variational inference to diffusion samplers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.30,<7",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    # Intel Macs need the last PyTorch release with x86_64 macOS wheels.
    # That release's NumPy bridge requires the NumPy 1.x ABI.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Keep Apple Silicon compatible with macOS 11+.
    "torch>=2.10,<2.11; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.10,<3; sys_platform != 'darwin'",
    "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
